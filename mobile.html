<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>Terry WMS 手機版</title>
    <link rel="manifest" href="data:application/json,{'name':'Terry WMS','short_name':'WMS','start_url':'.','display':'standalone','background_color':'%230f172a','theme_color':'%230f172a'}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* 登入頁 */
        .login-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
        }
        .login-logo { font-size: 48px; color: #3b82f6; margin-bottom: 10px; }
        .login-title { font-size: 28px; font-weight: bold; margin-bottom: 5px; }
        .login-subtitle { color: #64748b; font-size: 14px; margin-bottom: 30px; }
        .login-box {
            width: 100%;
            max-width: 320px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
        }
        .login-input {
            width: 100%;
            padding: 14px 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            margin-bottom: 12px;
        }
        .login-input:focus { outline: none; border-color: #3b82f6; }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .login-btn:active { background: #2563eb; }
        .login-error { color: #f87171; font-size: 14px; margin-bottom: 12px; display: none; }
        
        /* 主頁面 */
        .app-container { display: none; min-height: 100vh; flex-direction: column; }
        .app-container.active { display: flex; }
        
        /* 頂部 */
        .app-header {
            background: #1e293b;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .app-logo { display: flex; align-items: center; gap: 8px; }
        .app-logo i { color: #3b82f6; font-size: 20px; }
        .app-logo span { font-weight: bold; font-size: 16px; }
        .user-info { display: flex; align-items: center; gap: 8px; }
        .user-name { font-size: 12px; color: #94a3b8; }
        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            border: none;
            color: #f87171;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
        }
        
        /* 主選單 */
        .main-menu {
            flex: 1;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .menu-card {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border: 1px solid #475569;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .menu-card:active {
            transform: scale(0.98);
        }
        .menu-card.picking { border-color: #3b82f6; }
        .menu-card.inbound { border-color: #10b981; }
        .menu-card.dispatch { border-color: #f59e0b; }
        .menu-card.query { border-color: #8b5cf6; }
        
        .menu-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .menu-card.picking .menu-icon { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .menu-card.inbound .menu-icon { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .menu-card.dispatch .menu-icon { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .menu-card.query .menu-icon { background: rgba(139, 92, 246, 0.2); color: #8b5cf6; }
        
        .menu-text h3 { font-size: 18px; margin-bottom: 4px; }
        .menu-text p { font-size: 13px; color: #94a3b8; }
        .menu-arrow { margin-left: auto; color: #475569; font-size: 20px; }
        
        /* 功能頁面 */
        .func-page {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            background: #0f172a;
        }
        .func-page.active { display: flex; }
        
        .func-header {
            background: #1e293b;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            padding: 8px;
            cursor: pointer;
        }
        .func-title { font-size: 18px; font-weight: bold; }
        
        /* 掃描區 */
        .scan-section {
            background: linear-gradient(135deg, #1e3a5f 0%, #1e293b 100%);
            padding: 20px 16px;
            text-align: center;
        }
        .scan-input-wrap {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .scan-input {
            flex: 1;
            padding: 14px 16px;
            background: #0f172a;
            border: 2px solid #3b82f6;
            border-radius: 10px;
            color: #fff;
            font-size: 18px;
            text-align: center;
        }
        .scan-input:focus { outline: none; border-color: #60a5fa; }
        .scan-btn {
            padding: 14px 20px;
            background: #3b82f6;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
        }
        .scan-btn:active { background: #2563eb; }
        .scan-hint { color: #64748b; font-size: 13px; }
        .scan-result {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .scan-result.success { display: block; background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .scan-result.error { display: block; background: rgba(239, 68, 68, 0.2); color: #f87171; }
        
        /* 清單區 */
        .list-section {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .list-header h4 { font-size: 16px; color: #94a3b8; }
        .list-progress { font-size: 14px; color: #10b981; font-weight: bold; }
        
        .list-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .list-item.completed { border-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .list-item.shortage { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        
        .item-row { display: flex; justify-content: space-between; align-items: center; }
        .item-location { font-size: 20px; font-weight: bold; color: #3b82f6; font-family: monospace; }
        .item-status { font-size: 12px; padding: 4px 8px; border-radius: 6px; }
        .item-status.pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .item-status.done { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .item-status.shortage { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        
        .item-product { font-size: 15px; color: #fff; margin: 8px 0 4px; }
        .item-detail { font-size: 13px; color: #64748b; }
        .item-qty { font-size: 24px; font-weight: bold; color: #fbbf24; text-align: right; }
        
        /* 選擇器 */
        .selector-section { padding: 16px; }
        .selector-label { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
        .selector-input {
            width: 100%;
            padding: 14px 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
        }
        
        /* 庫存查詢結果 */
        .query-result {
            padding: 16px;
        }
        .result-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .result-product { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .result-spec { font-size: 14px; color: #64748b; margin-bottom: 12px; }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-top: 1px solid #334155;
        }
        .result-loc { font-family: monospace; color: #3b82f6; font-weight: bold; }
        .result-qty { color: #fbbf24; font-weight: bold; }
        
        /* 底部操作 */
        .bottom-actions {
            padding: 16px;
            background: #1e293b;
            border-top: 1px solid #334155;
        }
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .action-btn:last-child { margin-bottom: 0; }
        .action-btn.primary { background: #3b82f6; color: #fff; }
        .action-btn.success { background: #10b981; color: #fff; }
        .action-btn.secondary { background: #334155; color: #fff; }
        .action-btn:active { opacity: 0.8; }
        
        /* 空狀態 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }
        .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        .empty-state p { font-size: 14px; }
        
        /* 載入中 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        .loading i { font-size: 32px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* 隱藏 */
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- 登入頁 -->
    <div id="login-page" class="login-page">
        <i class="fa-solid fa-warehouse login-logo"></i>
        <h1 class="login-title">Terry WMS</h1>
        <p class="login-subtitle">倉儲管理系統 - 手機版</p>
        <div class="login-box">
            <input type="email" id="login-email" class="login-input" placeholder="Email" value="admin@bafang.com">
            <input type="password" id="login-pwd" class="login-input" placeholder="密碼" value="123456">
            <div id="login-error" class="login-error"></div>
            <button onclick="doLogin()" class="login-btn">
                <i class="fa-solid fa-right-to-bracket"></i> 登入
            </button>
        </div>
    </div>
    
    <!-- 主頁面 -->
    <div id="app-main" class="app-container">
        <header class="app-header">
            <div class="app-logo">
                <i class="fa-solid fa-warehouse"></i>
                <span>Terry WMS</span>
            </div>
            <div class="user-info">
                <span class="user-name" id="display-user">-</span>
                <button onclick="doLogout()" class="logout-btn">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </header>
        
        <div class="main-menu">
            <div class="menu-card picking" onclick="openPage('picking')">
                <div class="menu-icon"><i class="fa-solid fa-barcode"></i></div>
                <div class="menu-text">
                    <h3>揀貨掃描</h3>
                    <p>波次揀貨確認</p>
                </div>
                <i class="fa-solid fa-chevron-right menu-arrow"></i>
            </div>
            
            <div class="menu-card inbound" onclick="openPage('inbound')">
                <div class="menu-icon"><i class="fa-solid fa-boxes-stacked"></i></div>
                <div class="menu-text">
                    <h3>入庫確認</h3>
                    <p>掃描板號確認入庫</p>
                </div>
                <i class="fa-solid fa-chevron-right menu-arrow"></i>
            </div>
            
            <div class="menu-card dispatch" onclick="openPage('dispatch')">
                <div class="menu-icon"><i class="fa-solid fa-truck-moving"></i></div>
                <div class="menu-text">
                    <h3>調度執行</h3>
                    <p>移位/合併作業</p>
                </div>
                <i class="fa-solid fa-chevron-right menu-arrow"></i>
            </div>
            
            <div class="menu-card query" onclick="openPage('query')">
                <div class="menu-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
                <div class="menu-text">
                    <h3>庫存快查</h3>
                    <p>查詢品項位置</p>
                </div>
                <i class="fa-solid fa-chevron-right menu-arrow"></i>
            </div>
        </div>
    </div>
    
    <!-- 揀貨掃描頁 -->
    <div id="page-picking" class="func-page">
        <header class="func-header">
            <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
            <span class="func-title">揀貨掃描</span>
        </header>
        
        <div class="selector-section">
            <div class="selector-label">選擇波次</div>
            <select id="picking-wave-select" class="selector-input" onchange="loadPickingWave()">
                <option value="">-- 請選擇 --</option>
            </select>
        </div>
        
        <div class="scan-section" id="picking-scan-area" style="display:none">
            <div class="scan-input-wrap">
                <input type="text" id="picking-scan" class="scan-input" placeholder="掃描儲位或板號">
                <button class="scan-btn" onclick="confirmPickingScan()"><i class="fa-solid fa-check"></i></button>
            </div>
            <p class="scan-hint">掃描後自動確認揀貨</p>
            <div id="picking-scan-result" class="scan-result"></div>
        </div>
        
        <div class="list-section" id="picking-list-area">
            <div class="list-header">
                <h4>揀貨清單</h4>
                <span class="list-progress" id="picking-progress">0/0</span>
            </div>
            <div id="picking-list">
                <div class="empty-state">
                    <i class="fa-solid fa-clipboard-list"></i>
                    <p>請先選擇波次</p>
                </div>
            </div>
        </div>
        
        <div class="bottom-actions" id="picking-actions" style="display:none">
            <button class="action-btn success" onclick="completePickingWave()">
                <i class="fa-solid fa-flag-checkered"></i> 揀貨完成（待電腦出庫）
            </button>
        </div>
    </div>
    
    <!-- 入庫確認頁 -->
    <div id="page-inbound" class="func-page">
        <header class="func-header">
            <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
            <span class="func-title">入庫確認</span>
        </header>
        
        <div class="scan-section">
            <div class="scan-input-wrap">
                <input type="text" id="inbound-scan" class="scan-input" placeholder="掃描入庫板號">
                <button class="scan-btn" onclick="confirmInboundScan()"><i class="fa-solid fa-check"></i></button>
            </div>
            <p class="scan-hint">掃描板號確認實際入庫</p>
            <div id="inbound-scan-result" class="scan-result"></div>
        </div>
        
        <div class="list-section">
            <div class="list-header">
                <h4>今日入庫記錄</h4>
                <span class="list-progress" id="inbound-count">0 筆</span>
            </div>
            <div id="inbound-list">
                <div class="loading"><i class="fa-solid fa-spinner"></i></div>
            </div>
        </div>
    </div>
    
    <!-- 調度執行頁 -->
    <div id="page-dispatch" class="func-page">
        <header class="func-header">
            <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
            <span class="func-title">調度執行</span>
        </header>
        
        <div class="selector-section">
            <div class="selector-label">選擇工單</div>
            <select id="dispatch-order-select" class="selector-input" onchange="loadDispatchOrder()">
                <option value="">-- 請選擇 --</option>
            </select>
        </div>
        
        <div class="scan-section" id="dispatch-scan-area" style="display:none">
            <div class="scan-input-wrap">
                <input type="text" id="dispatch-scan" class="scan-input" placeholder="掃描板號確認">
                <button class="scan-btn" onclick="confirmDispatchScan()"><i class="fa-solid fa-check"></i></button>
            </div>
            <p class="scan-hint">掃描板號確認執行</p>
            <div id="dispatch-scan-result" class="scan-result"></div>
        </div>
        
        <div class="list-section" id="dispatch-list-area">
            <div class="list-header">
                <h4>調度清單</h4>
                <span class="list-progress" id="dispatch-progress">0/0</span>
            </div>
            <div id="dispatch-list">
                <div class="empty-state">
                    <i class="fa-solid fa-clipboard-list"></i>
                    <p>請先選擇工單</p>
                </div>
            </div>
        </div>
        
        <div class="bottom-actions" id="dispatch-actions" style="display:none">
            <button class="action-btn success" onclick="completeDispatchOrder()">
                <i class="fa-solid fa-flag-checkered"></i> 完成工單
            </button>
        </div>
    </div>
    
    <!-- 庫存快查頁 -->
    <div id="page-query" class="func-page">
        <header class="func-header">
            <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
            <span class="func-title">庫存快查</span>
        </header>
        
        <div class="scan-section">
            <div class="scan-input-wrap">
                <input type="text" id="query-input" class="scan-input" placeholder="輸入品名或板號">
                <button class="scan-btn" onclick="doInventoryQuery()"><i class="fa-solid fa-search"></i></button>
            </div>
            <p class="scan-hint">支援模糊搜尋</p>
        </div>
        
        <div class="query-result" id="query-result">
            <div class="empty-state">
                <i class="fa-solid fa-box-open"></i>
                <p>輸入關鍵字搜尋庫存</p>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <!-- Firebase（與桌機版相同的 compat SDK 與共用模組）-->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/shared/firebase-config.js"></script>
    <script src="js/shared/data-format.js"></script>
    <script src="js/shared/stock-core.js"></script>
    <script src="js/shared/picking-list.js"></script>
    <script>
        // ============================================================
        // 手機版：與桌機版共用同一個 Firestore
        // - 揀貨：讀取桌機建立的波次，掃描進度即時寫回（桌機看得到）；
        //   揀完後標記「待出庫」，由桌機「完成波次」一次扣帳（交易）
        // - 調度：讀取桌機「發布到手機」的調度工單，掃描後直接以交易執行移板／併板
        // ============================================================
        firebase.initializeApp(window.FIREBASE_CONFIG);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const FieldValue = firebase.firestore.FieldValue;
        window.db = db;
        window.serverTimestamp = function() { return FieldValue.serverTimestamp(); };
        window.getOperatorName = function() {
            const u = window.currentUser;
            return u ? (u.name || u.email) : 'mobile';
        };

        window.pallets = [];
        let unsubscribePallets = null;

        function esc(v) {
            return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function showLoginError(msg) {
            const el = document.getElementById('login-error');
            el.innerText = msg;
            el.style.display = 'block';
        }

        // 登入後先確認帳號已開通、未停用（與桌機版相同規則）
        auth.onAuthStateChanged(async function(user) {
            if (!user) {
                window.currentUser = null;
                if (unsubscribePallets) { unsubscribePallets(); unsubscribePallets = null; }
                document.getElementById('login-page').style.display = 'flex';
                document.getElementById('app-main').classList.remove('active');
                return;
            }
            try {
                const snap = await db.collection('users').doc(String(user.email).toLowerCase()).get();
                if (!snap.exists) { showLoginError('此帳號尚未開通，請聯絡系統管理員'); return auth.signOut(); }
                const profile = Object.assign({ id: snap.id }, snap.data());
                if (profile.active === false) { showLoginError('此帳號已停用，請聯絡系統管理員'); return auth.signOut(); }
                window.currentUser = profile;
            } catch (e) {
                console.error(e);
                showLoginError('無法載入使用者資料，請檢查網路後再登入');
                return auth.signOut();
            }
            document.getElementById('login-error').style.display = 'none';
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('app-main').classList.add('active');
            document.getElementById('display-user').innerText = window.currentUser.name || user.email.split('@')[0];
            initData();
        });

        window.doLogin = async function() {
            const email = document.getElementById('login-email').value;
            const pwd = document.getElementById('login-pwd').value;
            document.getElementById('login-error').style.display = 'none';
            try {
                await auth.signInWithEmailAndPassword(email, pwd);
            } catch (err) {
                if (err.code === 'auth/user-not-found') showLoginError('帳號不存在');
                else if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') showLoginError('帳號或密碼錯誤');
                else showLoginError('登入失敗');
            }
        };

        window.doLogout = function() { auth.signOut(); };

        function initData() {
            if (unsubscribePallets) unsubscribePallets();
            unsubscribePallets = db.collection('pallets').onSnapshot(function(snap) {
                window.pallets = [];
                snap.forEach(function(d) {
                    const p = window.normalizeStockRecord(Object.assign({ id: d.id }, d.data()));
                    if ((p.quantity || 0) > 0 || (p.totalWeight || 0) > 0) window.pallets.push(p);
                });
            });
        }

        // 頁面切換
        function openPage(page) {
            document.getElementById('app-main').classList.remove('active');
            document.getElementById('page-' + page).classList.add('active');
            if (page === 'picking') loadPickingWaves();
            if (page === 'inbound') loadInboundRecords();
            if (page === 'dispatch') loadDispatchOrders();
        }

        function goBack() {
            document.querySelectorAll('.func-page').forEach(p => p.classList.remove('active'));
            document.getElementById('app-main').classList.add('active');
        }

        function setResult(id, ok, text) {
            const el = document.getElementById(id);
            el.className = 'scan-result ' + (ok ? 'success' : 'error');
            el.innerText = text;
            if (navigator.vibrate) navigator.vibrate(ok ? 100 : [100, 50, 100]);
        }

        // ========== 揀貨掃描 ==========
        let waves = [];
        let currentWave = null;
        let pickingItems = [];

        async function loadPickingWaves() {
            const select = document.getElementById('picking-wave-select');
            select.innerHTML = '<option value="">載入中...</option>';
            try {
                const snap = await db.collection('waves').where('status', 'in', ['pending', 'picking', 'sorting']).get();
                waves = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
                waves.sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
                select.innerHTML = '<option value="">-- 請選擇 --</option>' + waves.map(w =>
                    '<option value="' + esc(w.id) + '">' + esc(w.waveNo) + ' - ' + esc(w.logistics || '') + ' (' + esc(w.totalQty || 0) + '件)' +
                    (w.status === 'sorting' ? '【已揀完】' : '') + '</option>').join('');
            } catch (e) {
                console.error(e);
                select.innerHTML = '<option value="">載入失敗：' + esc(e.message) + '</option>';
            }
        }

        window.loadPickingWave = async function() {
            const waveId = document.getElementById('picking-wave-select').value;
            if (!waveId) {
                document.getElementById('picking-scan-area').style.display = 'none';
                document.getElementById('picking-actions').style.display = 'none';
                return;
            }
            // 讀最新的波次（含其他裝置的揀貨進度）
            const snap = await db.collection('waves').doc(waveId).get();
            if (!snap.exists) { alert('波次已不存在'); return loadPickingWaves(); }
            currentWave = Object.assign({ id: snap.id }, snap.data());

            // 與桌機版用同一套邏輯產生揀貨清單，項目 ID 一致，進度可以互通
            pickingItems = window.buildWavePickingList(currentWave, window.pallets);

            renderPickingList();
            document.getElementById('picking-scan-area').style.display = 'block';
            document.getElementById('picking-actions').style.display = 'block';
            document.getElementById('picking-scan').focus();
        };

        function renderPickingList() {
            const list = document.getElementById('picking-list');
            const completed = pickingItems.filter(i => i.completed).length;
            const total = pickingItems.filter(i => !i.shortage).length;
            document.getElementById('picking-progress').innerText = completed + '/' + total;

            if (pickingItems.length === 0) {
                list.innerHTML = '<div class="empty-state"><i class="fa-solid fa-clipboard-list"></i><p>無揀貨項目</p></div>';
                return;
            }

            list.innerHTML = pickingItems.map(item => {
                const cls = item.completed ? 'completed' : item.shortage ? 'shortage' : '';
                const status = item.completed ? '<span class="item-status done">✓ 完成</span>' :
                              item.shortage ? '<span class="item-status shortage">缺貨</span>' :
                              '<span class="item-status pending">待揀</span>';
                return '<div class="list-item ' + cls + '">' +
                    '<div class="item-row"><span class="item-location">' + esc(item.locationId) + '</span>' + status + '</div>' +
                    '<div class="item-product">' + esc(item.productName) + ' ' + esc(item.spec || '') + '</div>' +
                    '<div class="item-row"><span class="item-detail">' + esc(item.palletId || '-') + ' | ' + esc(item.batchNo || '') + ' ' + esc(item.expDate || '') + '</span>' +
                    '<span class="item-qty">' + esc(item.pickQty) + '</span></div></div>';
            }).join('');
        }

        window.confirmPickingScan = async function() {
            const input = document.getElementById('picking-scan');
            const scanned = input.value.trim();
            if (!scanned || !currentWave) return;

            const found = pickingItems.find(i => !i.completed && !i.shortage &&
                (i.palletId === scanned || i.locationId === scanned));
            if (!found) {
                setResult('picking-scan-result', false, '❌ 找不到：' + scanned);
                input.select();
                return;
            }

            try {
                await db.collection('waves').doc(currentWave.id).update({
                    completedItems: FieldValue.arrayUnion(found.id),
                    status: currentWave.status === 'sorting' ? 'sorting' : 'picking'
                });
            } catch (e) {
                setResult('picking-scan-result', false, '❌ 儲存進度失敗：' + e.message);
                return;
            }
            found.completed = true;
            setResult('picking-scan-result', true, '✓ ' + found.productName + ' x ' + found.pickQty);
            renderPickingList();
            input.value = '';
            input.focus();
        };

        // 手機只完成「揀貨」；扣庫存、訂單出貨由桌機「完成波次」以交易處理（避免重複扣帳）
        window.completePickingWave = async function() {
            const completed = pickingItems.filter(i => i.completed).length;
            const total = pickingItems.filter(i => !i.shortage).length;
            if (completed === 0) { alert('尚未揀貨任何項目'); return; }
            if (!confirm('揀貨完成？\n\n已揀：' + completed + '/' + total + '\n\n完成後請在電腦「完成波次」扣庫存出貨。')) return;
            try {
                await db.collection('waves').doc(currentWave.id).update({ status: 'sorting', pickedAt: new Date().toISOString() });
                alert('✅ 已標記揀貨完成，待電腦出庫');
                goBack();
            } catch (e) {
                alert('❌ 更新失敗：' + e.message);
            }
        };

        // ========== 入庫確認 ==========
        function loadInboundRecords() {
            const today = new Date().toLocalYMD();
            const inboundRecords = window.pallets.filter(p => window.normalizeDateValue(p.createdAt || p.inboundDate) === today);
            document.getElementById('inbound-count').innerText = inboundRecords.length + ' 筆';

            const list = document.getElementById('inbound-list');
            if (inboundRecords.length === 0) {
                list.innerHTML = '<div class="empty-state"><i class="fa-solid fa-inbox"></i><p>今日尚無入庫記錄</p></div>';
                return;
            }
            list.innerHTML = inboundRecords.map(r =>
                '<div class="list-item completed"><div class="item-row"><span class="item-location">' + esc(r.locationId) + '</span>' +
                '<span class="item-status done">已入庫</span></div><div class="item-product">' + esc(r.productName) + '</div>' +
                '<div class="item-row"><span class="item-detail">' + esc(r.palletId) + ' | ' + esc(r.batchNo || '-') + '</span>' +
                '<span class="item-qty">' + esc(r.quantity) + '</span></div></div>').join('');
        }

        window.confirmInboundScan = function() {
            const input = document.getElementById('inbound-scan');
            const scanned = input.value.trim();
            if (!scanned) return;
            const found = window.pallets.find(p => p.palletId === scanned);
            if (found) setResult('inbound-scan-result', true, '✓ 已存在：' + found.productName + ' @ ' + found.locationId);
            else setResult('inbound-scan-result', false, '❌ 板號不存在：' + scanned);
            input.value = '';
            input.focus();
        };

        // ========== 調度執行 ==========
        let dispatchOrders = [];
        let currentDispatch = null;

        async function loadDispatchOrders() {
            const select = document.getElementById('dispatch-order-select');
            select.innerHTML = '<option value="">載入中...</option>';
            try {
                const snap = await db.collection('dispatchOrders').get();
                dispatchOrders = snap.docs.map(d => Object.assign({ id: d.id }, d.data()))
                    .filter(o => o.status !== 'completed' && (o.operations || []).length > 0);
                dispatchOrders.sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
                select.innerHTML = '<option value="">-- 請選擇 --</option>' + dispatchOrders.map(o =>
                    '<option value="' + esc(o.id) + '">' + esc(o.orderNo || o.id) + ' - ' + esc(o.productName || '') +
                    ' (' + (o.completedOps || []).length + '/' + o.operations.length + ')</option>').join('');
            } catch (e) {
                console.error(e);
                select.innerHTML = '<option value="">載入失敗：' + esc(e.message) + '</option>';
            }
        }

        window.loadDispatchOrder = async function() {
            const id = document.getElementById('dispatch-order-select').value;
            if (!id) {
                document.getElementById('dispatch-scan-area').style.display = 'none';
                document.getElementById('dispatch-actions').style.display = 'none';
                return;
            }
            const snap = await db.collection('dispatchOrders').doc(id).get();
            if (!snap.exists) { alert('工單已不存在'); return loadDispatchOrders(); }
            currentDispatch = Object.assign({ id: snap.id }, snap.data());
            renderDispatchList();
            document.getElementById('dispatch-scan-area').style.display = 'block';
            document.getElementById('dispatch-actions').style.display = 'block';
            document.getElementById('dispatch-scan').focus();
        };

        function renderDispatchList() {
            const ops = currentDispatch ? currentDispatch.operations || [] : [];
            const done = currentDispatch ? currentDispatch.completedOps || [] : [];
            document.getElementById('dispatch-progress').innerText = done.length + '/' + ops.length;
            const list = document.getElementById('dispatch-list');
            if (ops.length === 0) {
                list.innerHTML = '<div class="empty-state"><i class="fa-solid fa-clipboard-list"></i><p>無調度項目</p></div>';
                return;
            }
            list.innerHTML = ops.map(op => {
                const completed = done.indexOf(op.id) >= 0;
                const status = completed ? '<span class="item-status done">✓ 完成</span>' :
                    '<span class="item-status pending">' + esc(op.type) + '</span>';
                return '<div class="list-item ' + (completed ? 'completed' : '') + '">' +
                    '<div class="item-row"><span class="item-location">' + esc(op.from) + '</span>' + status + '</div>' +
                    '<div class="item-product">' + esc(op.palletId || '-') + ' → ' + esc(op.to) + '</div>' +
                    '<div class="item-row"><span class="item-detail">' + esc(op.reason || op.type) + '</span>' +
                    '<span class="item-qty">' + esc(op.qty) + '</span></div></div>';
            }).join('');
        }

        // 合併的目標板：優先用文件 ID；舊工單沒有時，在目標儲位找同品名/規格/批號的一板
        async function resolveMergeTarget(op, sourceRef) {
            if (op.toDocId || op.toPalletId) return window.resolvePalletRef(op.toDocId, op.toPalletId, op.to);
            const src = (await sourceRef.get()).data() || {};
            const candidates = window.pallets.filter(p => p.locationId === op.to && p.id !== sourceRef.id &&
                p.productName === src.productName && (p.spec || '') === (src.spec || '') && (p.batchNo || '') === (src.batchNo || ''));
            if (candidates.length !== 1) throw new Error('目標儲位 ' + op.to + ' 找不到唯一的合併目標，請在電腦確認');
            return db.collection('pallets').doc(candidates[0].id);
        }

        window.confirmDispatchScan = async function() {
            const input = document.getElementById('dispatch-scan');
            const scanned = input.value.trim();
            if (!scanned || !currentDispatch) return;
            const done = currentDispatch.completedOps || [];
            const op = (currentDispatch.operations || []).find(o => done.indexOf(o.id) < 0 &&
                (o.palletId === scanned || o.from === scanned));
            if (!op) {
                setResult('dispatch-scan-result', false, '❌ 找不到：' + scanned);
                input.select();
                return;
            }

            try {
                // 與桌機相同的交易：確認棧板仍在、更新儲位或合併數量、寫異動記錄
                const sourceRef = await window.resolvePalletRef(op.docId, op.palletId, op.from);
                if (op.type === '合併' || op.type === 'merge') {
                    const targetRef = await resolveMergeTarget(op, sourceRef);
                    await window.mergePalletsTx(sourceRef, targetRef, { note: '手機調度工單 ' + (currentDispatch.orderNo || '') });
                } else {
                    await window.movePalletTx(sourceRef, op.to, { note: '手機調度工單 ' + (currentDispatch.orderNo || '') + (op.reason ? '：' + op.reason : '') });
                }
                await db.collection('dispatchOrders').doc(currentDispatch.id).update({
                    completedOps: FieldValue.arrayUnion(op.id),
                    status: 'in_progress'
                });
                currentDispatch.completedOps = done.concat([op.id]);
                setResult('dispatch-scan-result', true, '✓ ' + op.type + '：' + op.from + ' → ' + op.to);
            } catch (e) {
                console.error(e);
                setResult('dispatch-scan-result', false, '❌ ' + e.message);
                return;
            }
            renderDispatchList();
            input.value = '';
            input.focus();
        };

        window.completeDispatchOrder = async function() {
            const ops = currentDispatch ? currentDispatch.operations || [] : [];
            const done = currentDispatch ? currentDispatch.completedOps || [] : [];
            if (done.length === 0) { alert('尚未執行任何操作'); return; }
            if (!confirm('完成工單？\n\n已執行：' + done.length + '/' + ops.length)) return;
            try {
                await db.collection('dispatchOrders').doc(currentDispatch.id).update({
                    status: done.length >= ops.length ? 'completed' : 'partial',
                    completedAt: new Date().toISOString()
                });
                alert('✅ 工單完成！');
                goBack();
            } catch (e) {
                alert('❌ 更新失敗：' + e.message);
            }
        };

        // ========== 庫存快查 ==========
        window.doInventoryQuery = function() {
            const input = document.getElementById('query-input');
            const result = document.getElementById('query-result');
            const keyword = input.value.trim().toLowerCase();
            if (!keyword) return;

            const matches = window.pallets.filter(p =>
                (p.productName && p.productName.toLowerCase().includes(keyword)) ||
                (p.palletId && p.palletId.toLowerCase().includes(keyword)) ||
                (p.batchNo && p.batchNo.toLowerCase().includes(keyword))
            );
            if (matches.length === 0) {
                result.innerHTML = '<div class="empty-state"><i class="fa-solid fa-search"></i><p>找不到：' + esc(keyword) + '</p></div>';
                return;
            }
            const grouped = {};
            matches.forEach(p => {
                const key = p.productName + '|' + (p.spec || '');
                if (!grouped[key]) grouped[key] = { name: p.productName, spec: p.spec, items: [] };
                grouped[key].items.push(p);
            });
            result.innerHTML = Object.values(grouped).map(g =>
                '<div class="result-card"><div class="result-product">' + esc(g.name) + '</div><div class="result-spec">' + esc(g.spec || '') + '</div>' +
                g.items.map(p => '<div class="result-row"><span class="result-loc">' + esc(p.locationId) + '</span>' +
                    '<span class="result-qty">' + esc(p.quantity) + ' 件' + (p.expDate ? ' · ' + esc(p.expDate) : '') + '</span></div>').join('') +
                '</div>').join('');
        };

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active.id === 'picking-scan') confirmPickingScan();
                if (active.id === 'inbound-scan') confirmInboundScan();
                if (active.id === 'dispatch-scan') confirmDispatchScan();
                if (active.id === 'query-input') doInventoryQuery();
                if (active.id === 'login-pwd') doLogin();
            }
        });
    </script>
</body>
</html>
