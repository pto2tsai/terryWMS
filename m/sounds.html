<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聲音試聽</title>
<style>
  :root { --bg: #0b1120; --card: #111a2e; --line: #26324d; --text: #e5edf8; --sub: #8ea0bf; --pick: #22c55e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 140px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  header a { color: var(--text); text-decoration: none; font-size: 26px; padding: 4px 8px; }
  h1 { font-size: 22px; margin: 0; }
  .tip { color: var(--sub); font-size: 14px; line-height: 1.6; margin: 0 0 14px; }
  .tip b { color: #fbbf24; }
  .styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .styles div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; font-size: 13px; color: var(--sub); line-height: 1.5; }
  .styles b { display: block; color: var(--text); font-size: 16px; }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .row h2 { font-size: 18px; margin: 0 0 2px; }
  .row p { margin: 0 0 10px; color: var(--sub); font-size: 13px; }
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .btns button { -webkit-appearance: none; appearance: none; min-height: 58px; border-radius: 12px; border: 2px solid var(--line); background: #17223b; color: var(--text); font-size: 17px; font-weight: 700; }
  .btns button small { display: block; font-size: 12px; font-weight: 400; color: var(--sub); }
  .btns button.on { border-color: var(--pick); background: #0f2e22; }
  .btns button.on::after { content: " ✓"; color: var(--pick); }
  .sum { position: fixed; left: 0; right: 0; bottom: 0; background: #0f172a; border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); font-size: 15px; line-height: 1.6; }
  .sum b { color: var(--pick); }
  .all { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .all button { -webkit-appearance: none; appearance: none; min-height: 46px; border-radius: 12px; border: 1px solid #33456b; background: #1b2844; color: #7dd3fc; font-size: 15px; font-weight: 700; }
  .opt { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 14px; font-size: 16px; }
  .opt input { width: 24px; height: 24px; }
  .opt small { color: var(--sub); font-size: 13px; }
</style>
</head>
<body>
<header><a href="./" aria-label="回到選單">←</a><h1>聲音試聽</h1></header>
<p class="tip">每一列點 A、B、C 聽聽看，<b>點了就是選它</b>（綠色打勾），<b>馬上存在這支手機</b>，揀貨時就用你選的聲音；沒選的用 B 鐘聲。每個人的手機可以選不一樣的。<br>
iPhone：<b>側邊靜音鍵要關掉</b>，音量開大。</p>
<div class="styles">
  <div><b>A 遊戲風</b>對錯分很開，一聽就懂</div>
  <div><b>B 鐘聲風</b>清脆、不刺耳，吵的地方也聽得到</div>
  <div><b>C 說話風</b>手機直接說「好」「錯了」</div>
</div>
<label class="opt"><input type="checkbox" id="flash-on" checked> <b style="white-space:nowrap">螢幕外框閃光</b> <small>（綠＝對、紅＝錯、橘＝不夠、藍＝分好；改單警示一定會閃，揀貨時按「知道了」才停）</small></label>
<div class="all">
  <button onclick="playAll('A')">▶ A 全部聽</button>
  <button onclick="playAll('B')">▶ B 全部聽</button>
  <button onclick="playAll('C')">▶ C 全部聽</button>
</div>
<div id="rows"></div>
<div class="sum" id="sum"></div>

<script src="js/sound.js?v=20261002c"></script>
<script>
// 每一列點 A、B、C：馬上播、馬上記在這支手機（揀貨時就用它）；沒選的用 B 鐘聲
const NAMES = { A: '遊戲', B: '鐘聲', C: '說話' };
function draw() {
  const pick = window.soundStyles();
  document.getElementById('rows').innerHTML = window.SOUND_EVENTS.map(function(e) {
    const cur = pick[e[0]] || 'B';
    return '<div class="row"><h2>' + e[1] + '</h2><p>' + e[2] + '</p><div class="btns">' +
      ['A', 'B', 'C'].map(function(s) { return '<button class="' + (cur === s ? 'on' : '') + '" onclick="choose(\'' + e[0] + '\',\'' + s + '\')">' + s + '<small>' + NAMES[s] + (s === 'B' ? '（預設）' : '') + '</small></button>'; }).join('') +
      '</div></div>';
  }).join('');
  document.getElementById('sum').innerHTML = '✅ 已存在這支手機，揀貨時就用：<b>' + window.SOUND_EVENTS.map(function(e) { return e[1] + ' ' + (pick[e[0]] || 'B'); }).join('、') + '</b>' +
    ' <button onclick="resetAll()" style="margin-left:6px;-webkit-appearance:none;border:1px solid #33456b;background:#1b2844;color:#7dd3fc;border-radius:8px;padding:4px 10px;font-size:13px">全部恢復 B</button>';
}
window.choose = function(ev, s) { window.playSound(ev, s); window.edgeFlash(ev); window.setSoundStyle(ev, s === 'B' ? null : s); draw(); };
window.resetAll = function() { window.resetSoundStyles(); draw(); };
let busy = false;
window.playAll = function(s) {
  if (busy) return; busy = true;
  const gap = s === 'C' ? 1700 : s === 'B' ? 1800 : 1400;
  window.SOUND_EVENTS.forEach(function(e, i) { setTimeout(function() { window.playSound(e[0], s); window.edgeFlash(e[0]); }, i * gap); });
  setTimeout(function() { busy = false; window.stopFlash(); }, window.SOUND_EVENTS.length * gap + 1500);
};
const fo = document.getElementById('flash-on');
fo.checked = window.flashOn();
fo.onchange = function() { window.setFlashOn(fo.checked); if (fo.checked) window.edgeFlash('done'); };
// 改單警示的閃光：點一下畫面（按鈕以外）就停
document.addEventListener('pointerdown', function(e) { if (!e.target.closest('button')) window.stopFlash(); });
draw();
</script>
</body>
</html>
