<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terry WMS 現場看板</title>
    <!--
      現場看板：放在倉庫現場的電視／大螢幕，只顯示「現在要做的事」
      - 沒有選單、全螢幕、大字（3～5 公尺外看得清楚）
      - 資料即時更新（Firestore 即時監聽，不是定時整頁重新整理），斷線會自動重新連線
      - 建議用「唯讀」角色的專用帳號登入：螢幕只能看、不能改資料；登入一次就會記住
      - 晚上 20:00～隔天 06:30、而且沒有工作時自動調暗（有工作照常亮；網址加 ?night=off 可關閉）
    -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/shared/firebase-config.js"></script>
    <script src="js/shared/data-format.js"></script>
    <script src="js/shared/erp-schedule.js"></script>
    <script src="js/shared/erp-fix.js"></script>
    <script src="js/shared/sales-case.js"></script>
    <script src="js/shared/rack-config.js"></script>
    <script src="js/shared/stock-core.js"></script>
    <script src="js/shared/product-rules.js"></script>
    <script src="js/shared/picking-list.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; background: #0b1120; color: #e2e8f0; font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; overflow: hidden; }
        body.night #board { filter: brightness(0.6); }
        #board { height: 100%; display: flex; flex-direction: column; padding: 1.2vw 1.4vw; gap: 1vw; transition: filter 1s; }
        header { display: flex; align-items: center; gap: 1.5vw; }
        header h1 { font-size: 2.6vw; font-weight: 900; color: #fff; }
        #clock { margin-left: auto; font-size: 3vw; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
        #date { font-size: 1.4vw; color: #94a3b8; }
        #conn { font-size: 1.2vw; padding: .3vw .8vw; border-radius: 99px; background: #14532d; color: #bbf7d0; }
        #conn.bad { background: #7f1d1d; color: #fecaca; }
        /* 鼎新匯入有狀況：看板上方紅條（沒事就不顯示） */
        #other-wh { font-size: 1.5vw; color: #94a3b8; margin: -.4vw 0 .8vw; }
        #other-wh b { color: #e2e8f0; font-size: 1.8vw; }
        #erp-alert { display: none; flex-wrap: wrap; gap: .7vw; margin-bottom: 1vw; }
        #erp-alert.show { display: flex; }
        #erp-alert .chip { display: inline-block; padding: .45vw 1.1vw; border-radius: .7vw; font-size: 1.75vw; font-weight: 800; color: #fff; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; border: .18vw solid; }
        #erp-alert .chip b { font-size: 2.2vw; color: #fde047; }
        #erp-alert .chip.red { background: #7f1d1d; border-color: #ef4444; }
        #erp-alert .chip.org { background: #7c2d12; border-color: #f97316; }
        #erp-alert .chip.gray { background: #1e293b; border-color: #475569; color: #cbd5e1; }
        #erp-alert .chip.gray b { color: #e2e8f0; }
        .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1vw; }
        .stat { background: #111827; border-radius: 1vw; padding: .8vw 1vw; border-top: .35vw solid var(--c); }
        .stat .n { font-size: 3.6vw; font-weight: 900; color: #fff; line-height: 1.1; }
        .stat .l { font-size: 1.3vw; color: #94a3b8; }
        .cols { flex: 1; display: grid; grid-template-columns: 2fr 1fr; gap: 1vw; min-height: 0; }
        /* 調度工單一週用不到幾次：有進行中的工單才出現第三欄 */
        .cols.with-dispatch { grid-template-columns: 2fr 1fr 1fr; }
        #col-dispatch { display: none; }
        .cols.with-dispatch #col-dispatch { display: flex; }
        .col.main h2 { font-size: 2.3vw; }
        .col.main .card .name { font-size: 2.3vw; }
        .col.main .card .qty { font-size: 2.6vw; }
        .col.main .card .sub { font-size: 1.6vw; }
        .col.main .bar { height: 1vw; }
        .col { background: #111827; border-radius: 1vw; display: flex; flex-direction: column; min-height: 0; border: .2vw solid var(--c); }
        .col h2 { background: var(--c); color: #fff; font-size: 1.9vw; padding: .6vw 1vw; display: flex; justify-content: space-between; }
        .list { flex: 1; overflow: hidden; padding: .8vw; display: flex; flex-direction: column; gap: .7vw; }
        .card { background: #1e293b; border-radius: .7vw; padding: .7vw .9vw; border-left: .45vw solid var(--c); }
        .card.red { border-left-color: #ef4444; background: #3b1219; }
        .card .t { display: flex; justify-content: space-between; align-items: baseline; gap: .6vw; }
        .card .name { font-size: 1.8vw; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card .qty { font-size: 2.1vw; font-weight: 900; color: #fde047; white-space: nowrap; }
        .card .sub { font-size: 1.35vw; color: #cbd5e1; margin-top: .2vw; display: flex; justify-content: space-between; gap: .6vw; }
        .card .loc { color: #67e8f9; font-weight: 800; font-size: 1.6vw; white-space: nowrap; }
        .bar { height: .7vw; background: #334155; border-radius: 99px; margin-top: .5vw; overflow: hidden; }
        .bar > div { height: 100%; background: var(--c); }
        .empty { margin: auto; text-align: center; color: #4ade80; font-size: 2vw; font-weight: 800; }
        /* 像速食店出餐螢幕：每張單顯示等了多久，超時變黃、變紅；新進來的單閃一下 */
        .card .age { font-weight: 800; color: #94a3b8; white-space: nowrap; }
        .card.warn { border-left-color: #eab308; background: #3a3413; }
        .card.warn .age { color: #fde047; }
        .card.late { border-left-color: #ef4444; background: #3b1219; }
        .card.late .age { color: #fca5a5; animation: blink 1.2s step-end infinite; }
        .card.fresh { animation: fresh 2.5s ease-out; }
        @keyframes blink { 50% { opacity: .35; } }
        /* 紅色小方塊：還沒處理就一直慢慢閃（處理好自動停）；剛出現的快閃 30 秒 */
        #erp-alert .chip.red { animation: chipSlow 2s ease-in-out infinite; }
        @keyframes chipSlow { 50% { background: #b91c1c; box-shadow: 0 0 1.5vw .3vw rgba(239,68,68,.55); } }
        #erp-alert .chip.pulse { animation: chipPulse 1s ease-in-out infinite; }
        @keyframes chipPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } 50% { box-shadow: 0 0 0 .7vw rgba(239,68,68,.85), 0 0 2.5vw .8vw rgba(239,68,68,.6); background: #dc2626; border-color: #fecaca; } }
        /* 整個螢幕外框閃紅光 3 下（倉庫另一頭也看得到） */
        #edge { position: fixed; inset: 0; pointer-events: none; z-index: 50; box-shadow: inset 0 0 0 1.2vw #ef4444, inset 0 0 6vw 2vw rgba(239,68,68,.7); opacity: 0; }
        #edge.on { animation: edgeFlash .6s ease-in-out 3; }
        @keyframes edgeFlash { 50% { opacity: 1; } }
        /* 波次卡片「還沒問業務」：慢慢閃，問過就停 */
        .ask-not { animation: blink 1.6s ease-in-out infinite; }
        /* 開聲音的小按鈕（網頁規定要先按一下才能出聲） */
        #snd { margin-left: 1vw; font-size: 1.2vw; padding: .3vw .9vw; border-radius: 99px; border: .15vw solid #475569; background: #1e293b; color: #cbd5e1; cursor: pointer; }
        #snd.on { border-color: #16a34a; color: #86efac; }
        @keyframes fresh { 0% { box-shadow: 0 0 0 .4vw #fff; } 100% { box-shadow: 0 0 0 0 transparent; } }
        .more { text-align: center; color: #94a3b8; font-size: 1.3vw; }
        #login { position: fixed; inset: 0; background: #0b1120; display: flex; align-items: center; justify-content: center; z-index: 10; }
        #login form { background: #111827; padding: 32px; border-radius: 16px; width: 380px; display: flex; flex-direction: column; gap: 12px; }
        #login h2 { color: #fff; font-size: 22px; }
        #login p { color: #94a3b8; font-size: 13px; }
        #login input { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0b1120; color: #fff; font-size: 16px; }
        #login button { padding: 12px; border-radius: 8px; border: none; background: #2563eb; color: #fff; font-size: 16px; font-weight: bold; }
        #login-err { color: #f87171; font-size: 14px; min-height: 18px; }
    </style>
</head>
<body>
    <div id="login">
        <form onsubmit="doLogin(event)">
            <h2>現場看板登入</h2>
            <p>建議用「唯讀」角色的專用帳號（螢幕只能看、不能改資料）。登入一次就會記住。</p>
            <input id="email" type="email" placeholder="帳號（Email）" autocomplete="username" required>
            <input id="pwd" type="password" placeholder="密碼" autocomplete="current-password" required>
            <div id="login-err"></div>
            <button type="submit">登入</button>
        </form>
    </div>

    <div id="board">
        <header>
            <h1 id="board-title">📋 倉庫現場看板</h1>
            <span id="conn">● 即時更新中</span>
            <button id="snd" onclick="toggleBoardSound()">🔇 點一下開聲音</button>
            <div style="margin-left:auto;text-align:right">
                <div id="clock">--:--</div>
                <div id="date"></div>
            </div>
        </header>
        <div id="other-wh"></div>
        <div id="erp-alert"></div>
        <div id="edge"></div>
        <div class="stats">
            <div class="stat" style="--c:#f97316"><div class="n" id="s-wave">0</div><div class="l">今天完成波次</div></div>
            <div class="stat" style="--c:#fb923c"><div class="n" id="s-out">0</div><div class="l">今天出貨（件）</div></div>
            <div class="stat" style="--c:#22c55e"><div class="n" id="s-in">0</div><div class="l">今天入庫（板）</div></div>
            <div class="stat" style="--c:#6366f1"><div class="n" id="s-move">0</div><div class="l">今天搬板</div></div>
            <div class="stat" style="--c:#ef4444"><div class="n" id="s-exp">0</div><div class="l">7 天內到期／已過期（板）</div></div>
        </div>
        <!-- 波次出貨是現場最主要的工作：放最左邊、佔一半畫面、字最大 -->
        <div class="cols" id="cols">
            <div class="col main" style="--c:#ea580c"><h2><span>📦 揀貨波次（出貨）</span><span id="c-waves">0</span></h2><div class="list" id="l-waves"></div></div>
            <div class="col" style="--c:#16a34a"><h2><span>🚚 待上架</span><span id="c-tasks">0</span></h2><div class="list" id="l-tasks"></div></div>
            <div class="col" id="col-dispatch" style="--c:#7c3aed"><h2><span>🔁 調度工單</span><span id="c-dispatch">0</span></h2><div class="list" id="l-dispatch"></div></div>
        </div>
    </div>

    <script>
    firebase.initializeApp(window.FIREBASE_CONFIG);
    var db = firebase.firestore(), auth = firebase.auth();
    window.db = db;
    var unsubs = [];
    // ---------- 哪個倉庫的看板：網址 ?wh=K 是 K 庫，沒寫是 I、J 庫 ----------
    // 只顯示這個倉庫要做的事（待上架、揀貨、調度看儲位第一個字）；辦公室的提醒（要改鼎新、訂單檔）兩邊都顯示
    var WH = String(new URLSearchParams(location.search).get('wh') || '').toUpperCase() === 'K' ? 'K' : 'IJ';
    var MY = WH === 'K' ? ['K'] : ['I', 'J'], MAIN = WH !== 'K';
    var WH_NAME = WH === 'K' ? 'K 庫' : 'I、J 庫';
    function whOf(loc) { var m = /^([A-Z])-/.exec(String(loc || '').trim().toUpperCase()); return m && /[IJK]/.test(m[1]) ? m[1] : ''; }
    // 儲位看不出是哪一庫（還沒指定、練習模式）的，放在 I、J 庫的看板
    function isMine(loc) { var w = whOf(loc); return w ? MY.indexOf(w) >= 0 : MAIN; }
    function isOther(loc) { return !isMine(loc); }
    // 揀貨項目在哪一庫：跟手機一樣（K 開頭儲位＝K 庫；其他看手機記起來的「商品在哪一間」；看不出來的放 I、J 庫）
    function itemMine(i) {
        var h = window.homeOf ? window.homeOf(i.key) : '';
        if (h) return MY.indexOf(h) >= 0;
        return whOf(i.locationId) === 'K' ? !MAIN : MAIN;
    }
    var OTHER_NAME = WH === 'K' ? 'I、J 庫' : 'K 庫';
    document.title = WH_NAME + ' 現場看板';
    setTimeout(function() { $('board-title').textContent = '📋 ' + WH_NAME + '現場看板'; }, 0);
    // 等待時間超過幾分鐘變黃、變紅（揀貨波次、待上架、調度工單）
    var AGE_LIMIT = { waves: [30, 60], tasks: [60, 120], dispatch: [120, 240] };
    var seen = {}, lastDraw = {};
    function minsSince(v) {
        if (!v) return null;
        var t = v.toDate ? v.toDate().getTime() : (v.seconds ? v.seconds * 1000 : new Date(v).getTime());
        return isNaN(t) ? null : Math.max(0, Math.floor((Date.now() - t) / 60000));
    }
    function ageText(m) { return m == null ? '' : m < 60 ? '⏱ ' + m + ' 分' : '⏱ ' + Math.floor(m / 60) + ' 時 ' + (m % 60) + ' 分'; }
    // 卡片共用：等待時間、超時顏色、新單閃一下
    function ageClass(kind, row, extra) {
        var m = minsSince(row.createdAt), lim = AGE_LIMIT[kind];
        var cls = extra ? ' ' + extra : (m != null && m >= lim[1] ? ' late' : m != null && m >= lim[0] ? ' warn' : '');
        var key = kind + ':' + row.id;
        if (seen[kind] && !seen[kind][key + '#']) cls += ' fresh';
        return { cls: cls, age: '<span class="age">' + ageText(m) + '</span>' };
    }
    function remember(kind, rows) { seen[kind] = {}; rows.forEach(function(r) { seen[kind][kind + ':' + r.id + '#'] = true; }); }
    var MAX = 30;   // 每欄最多畫幾張卡片（實際依螢幕放得下的數量，其他顯示「還有 N 筆」）

    function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function $(id) { return document.getElementById(id); }

    window.doLogin = async function(e) {
        e.preventDefault();
        $('login-err').textContent = '';
        try { await auth.signInWithEmailAndPassword($('email').value.trim(), $('pwd').value); }
        catch (err) { $('login-err').textContent = '登入失敗：' + (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential' ? '帳號或密碼錯誤' : err.message); }
    };

    auth.onAuthStateChanged(async function(user) {
        unsubs.forEach(function(u) { u(); }); unsubs = [];
        if (!user) { $('login').style.display = 'flex'; return; }
        try {
            var snap = await db.collection('users').doc(String(user.email).toLowerCase()).get();
            if (!snap.exists || snap.data().active === false) { $('login-err').textContent = '此帳號尚未開通或已停用'; return auth.signOut(); }
        } catch (err) { $('login-err').textContent = '無法讀取帳號資料，請檢查網路'; return; }
        $('login').style.display = 'none';
        startListeners();
        keepAwake();
    });

    // ---------- 連線狀態：斷線時顯示紅色，監聽失敗 10 秒後自動重新連線 ----------
    var failed = false;
    function setConn(ok, text) {
        var el = $('conn');
        el.className = ok ? '' : 'bad';
        el.textContent = ok ? '● 即時更新中' : '● ' + (text || '連線中斷，重新連線中…');
    }
    window.addEventListener('offline', function() { setConn(false, '網路斷線，恢復後會自動更新'); });
    window.addEventListener('online', function() { setConn(true); });

    function listen(query, onData) {
        var u = query.onSnapshot({ includeMetadataChanges: true }, function(snap) {
            if (!snap.metadata.fromCache) setConn(true);
            onData(snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); }));
        }, function(err) {
            console.warn('看板監聽失敗', err);
            if (failed) return;
            failed = true;
            setConn(false);
            setTimeout(function() { failed = false; unsubs.forEach(function(f) { f(); }); unsubs = []; startListeners(); }, 10000);
        });
        unsubs.push(u);
    }

    // 依螢幕實際放得下幾張卡片顯示，放不下的寫「還有 N 筆」（不同尺寸的電視都不會被切掉）
    function render(listId, countId, rows, cardFn, emptyText, kind) {
        if (kind) lastDraw[kind] = function() { render(listId, countId, rows, cardFn, emptyText); };
        $(countId).textContent = rows.length;
        var el = $(listId);
        if (rows.length === 0) { el.innerHTML = '<div class="empty">✅ ' + emptyText + '</div>'; return; }
        var n = Math.min(rows.length, MAX);
        var draw = function() {
            el.innerHTML = rows.slice(0, n).map(cardFn).join('') + (rows.length > n ? '<div class="more">還有 ' + (rows.length - n) + ' 筆…</div>' : '');
        };
        draw();
        while (n > 1 && el.scrollHeight > el.clientHeight + 1) { n--; draw(); }
        if (kind) remember(kind, rows);
        checkNight();
    }
    // 每分鐘更新等待時間（不用等資料變動）
    setInterval(function() { Object.keys(lastDraw).forEach(function(k) { lastDraw[k](); }); }, 60000);

    // 鼎新匯入的狀況：匯入失敗／要處理、訂單檔等太久沒人處理、訂單沒有物流商
    var erpDocs = [], noLogistics = 0, erpSched = null, erpFix = [], erpRet = [], waveRets = [];
    // 鼎新改單後，已經揀了但現在用不到、要放回架上的（跟電腦版 waveReturnsPending 同樣算法）
    function waveReturns(w) {
        var log = w.pickLog;
        if (!Array.isArray(log) || !(w.completedItems || []).every(function(id) { return log.some(function(e) { return e.id === id; }); })) return [];
        var net = {}, names = {}, need = {};
        log.forEach(function(e) { net[e.key] = (net[e.key] || 0) + (e.type === 'return' ? -e.qty : e.qty); names[e.key] = e; });
        (w.summary || []).forEach(function(sm) { var k = sm.productName + '|||' + (sm.spec || ''); need[k] = (need[k] || 0) + (parseFloat(sm.totalQty) || 0); });
        return Object.keys(net).filter(function(k) { return net[k] - (need[k] || 0) > 0.0001; })
            .map(function(k) { return names[k].productName + ' ' + (Math.round((net[k] - (need[k] || 0)) * 1000) / 1000) + ' 件'; });
    }
    // 揀貨時按「不夠」的品項：問過業務了沒（手機按「傳 LINE 問業務」會記在波次 salesAsked）
    function waveAsk(w) {
        // 按「不夠」當下就自動通知業務（業務看板）；這裡寫業務處理到哪裡：等業務處理／業務處理中／業務回覆了什麼
        var m = w._mine;
        var cs = (window.waveSalesCases ? window.waveSalesCases(w) : []).filter(function(c) {
            return !m || !m.keys || m.keys.indexOf(c.key) >= 0 || (MAIN && m.allKeys.indexOf(c.key) < 0);
        });
        if (!cs.length) return '';
        var waiting = cs.some(function(c) { return window.salesCaseStatus(c.info) !== 'replied'; });
        return '<div class="sub' + (cs.some(function(c) { return window.salesCaseStatus(c.info) === 'new'; }) ? ' ask-not' : '') + '" style="color:' + (waiting ? '#fb923c' : '#7dd3fc') + ';font-weight:700;display:block">⚠️ 缺 ' + cs.length + ' 項・' +
            cs.slice(0, 2).map(function(c) { return esc(c.productName) + '：' + esc(window.salesCaseLabel(c.info)); }).join('；') + (cs.length > 2 ? ' 等' : '') + '</div>';
    }
    // ---------- 剛發生的紅色提醒：閃、外框閃、響一聲 ----------
    var pulseUntil = {}, seenRed = {}, lastUnsent = 0, pulseTimer = null, boardStart = Date.now();
    // 還有紅色沒處理：看板剛打開先提醒一次，之後每 10 分鐘再提醒（外框閃＋響一聲），不一直盯著螢幕也不會漏掉
    function remindIfRed() { if (document.querySelector('#erp-alert .chip.red')) attention(); }
    setTimeout(remindIfRed, 9000);
    setInterval(remindIfRed, 10 * 60000);
    function attention() {
        var e = $('edge'); e.classList.remove('on'); void e.offsetWidth; e.classList.add('on');
        if (soundOn) chime();
    }
    var soundOn = false, actx = null;
    // 預設開著（關掉才記 '0'）
    soundOn = true;
    try { soundOn = localStorage.getItem('board-sound') !== '0'; } catch (e) {}
    // 網頁規定：打開後要先有人點一下才能出聲（看板電腦用「不用點也能出聲」的捷徑打開就不受限）
    // 按鈕照「現在真的能不能出聲」寫：記得要開、但還不能出聲 → 寫「點一下開聲音」
    function audioReady() {
        try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; }
        return actx.state === 'running';
    }
    window.toggleBoardSound = function() {
        if (soundOn && !audioReady()) { actx.resume().then(function() { drawSndBtn(); chime(); }); return; }
        soundOn = !soundOn;
        try { localStorage.setItem('board-sound', soundOn ? '1' : '0'); } catch (e) {}
        if (soundOn) { audioReady(); actx.resume().then(function() { drawSndBtn(); chime(); }); }
        drawSndBtn();
    };
    setTimeout(drawSndBtn, 0);
    setTimeout(drawSndBtn, 1500);
    function drawSndBtn() {
        var on = soundOn && audioReady(), b = $('snd');
        b.textContent = on ? '🔊 聲音開著' : '🔇 點一下開聲音';
        b.classList.toggle('on', on);
    }
    // 叮咚（兩個音）：跟手機鐘聲同一種感覺
    function chime() {
        try {
            actx = actx || new (window.AudioContext || window.webkitAudioContext)();
            if (actx.state === 'suspended') actx.resume();
            [[880, 0], [660, .35]].forEach(function(n) {
                var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + n[1];
                o.type = 'sine'; o.frequency.value = n[0]; o.connect(g); g.connect(actx.destination);
                g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.6, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
                o.start(t); o.stop(t + 1.3);
            });
        } catch (e) {}
    }
    // 上方提醒：一件事一個小方塊（紅＝現在要處理、橙＝要注意、灰＝處理了在等別人），明細在手機、電腦看
    // 晚上沒事做才調暗；有波次、待上架、調度或紅色提醒就照常亮（晚上也會先揀隔天早上的貨）
    // 資料一有變就重新看一次（不用等下一次時鐘）
    function checkNight() {
        var d = new Date(), mins = d.getHours() * 60 + d.getMinutes();
        var busy = !!document.querySelector('#l-waves .card, #l-tasks .card, #l-dispatch .card, #erp-alert .chip.red');
        var night = !/[?&]night=off/.test(location.search) && (mins >= 20 * 60 || mins < 6 * 60 + 30) && !busy;
        document.body.classList.toggle('night', night);
    }
    function drawErpAlert() {
        var items = [];
        // key：同一件事同一個 key（紅色的新 key＝剛發生，要閃）
        var chip = function(lvl, icon, html, key) { items.push({ lvl: lvl, icon: icon, html: html, key: key || '' }); };
        var num = function(n) { return '<b>' + esc(n) + '</b>'; };
        var bad = erpDocs.filter(function(r) { return r.status === 'attention' || r.status === 'error'; }).length;
        var waiting = erpDocs.filter(function(r) { return r.status === 'pending' && Date.now() - Date.parse(r.receivedAt) > 15 * 60000; }).length;
        var missed = window.erpMissedSlot(erpDocs, erpSched, new Date());
        if (missed) chip('red', '📭', num(missed) + ' 訂單檔沒收到', 'missed:' + missed);
        if (waiting) chip('org', '⏳', '訂單檔超過 ' + num(15) + ' 分沒匯入');
        if (bad) chip('red', '⚠️', '鼎新匯入 ' + num(bad) + ' 份要處理', 'bad:' + bad);
        // 鼎新改單，已經揀了要放回架上的（揀貨員照手機做）
        waveRets.forEach(function(x) { chip('red', '↩️', esc(x.waveNo) + ' 要放回：' + esc(x.rets.join('、')), 'ret:' + x.waveNo + ':' + x.rets.join('、')); });
        if (noLogistics) chip('org', '🚚', num(noLogistics) + ' 張訂單沒有物流商');
        // 業務要改鼎新（缺貨少出＋出貨後鼎新對不上）：還沒傳給業務的紅色，都傳了灰色（等業務改好、匯入後自動消失）
        var byId = {};
        erpFix.concat(erpRet).forEach(function(o) { byId[o.id] = o; });
        var ids = Object.keys(byId), unsent = ids.filter(function(k) { return !window.erpIsSent(byId[k]); }).length;
        if (ids.length) chip(unsent ? 'red' : 'gray', '📝', '要改鼎新 ' + num(ids.length) + ' 張・' + (unsent ? num(unsent) + ' 張還沒傳給業務' : '都傳了，等業務改'), unsent ? 'erp-unsent' : '');
        // 剛發生的紅色（新出現、或還沒傳的張數變多）：閃 30 秒＋螢幕外框閃 3 下＋（開了聲音）響一聲
        // 剛打開看板的前幾秒是在載入舊資料，不算
        var reds = {}, fresh = [];
        items.forEach(function(c) { if (c.lvl === 'red' && c.key) { reds[c.key] = true; if (c.key !== 'erp-unsent' && !seenRed[c.key]) fresh.push(c.key); } });
        if (unsent > lastUnsent) fresh.push('erp-unsent');
        seenRed = reds; lastUnsent = unsent;
        if (Date.now() - boardStart > 8000 && fresh.length) {
            fresh.forEach(function(k) { pulseUntil[k] = Date.now() + 30000; });
            attention();
        }
        var now = Date.now();
        $('erp-alert').innerHTML = items.map(function(c) {
            return '<span class="chip ' + c.lvl + (c.key && pulseUntil[c.key] > now ? ' pulse' : '') + '">' + c.icon + ' ' + c.html + '</span>';
        }).join('');
        $('erp-alert').classList.toggle('show', items.length > 0);
        checkNight();
        // 閃完 30 秒重畫一次（停在紅色）
        clearTimeout(pulseTimer);
        var left = Object.keys(pulseUntil).map(function(k) { return pulseUntil[k] - now; }).filter(function(t) { return t > 0; });
        if (left.length) pulseTimer = setTimeout(drawErpAlert, Math.min.apply(null, left) + 200);
    }
    lastDraw.erpAlert = drawErpAlert;

    function startListeners() {
        var ym = new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 7);   // 台灣時間的年-月（跟 Google 自動程式寫入的 month 一致）
        listen(db.collection('erpInbox').where('month', '==', ym).where('sensitive', '==', false), function(rows) { erpDocs = rows; drawErpAlert(); });
        unsubs.push(db.collection('settings').doc('erpImport').onSnapshot(function(d) { erpSched = d.exists ? d.data() : null; drawErpAlert(); }, function() {}));
        listen(db.collection('salesOrders').where('erpFixNeeded', '==', true), function(rows) { erpFix = rows.filter(function(o) { return (o.shortShipped || []).some(function(x) { return Math.abs(x.want - x.got) >= 0.001; }); }); drawErpAlert(); });
        listen(db.collection('salesOrders').where('erpReturnNeeded', '==', true), function(rows) { erpRet = rows; drawErpAlert(); });
        listen(db.collection('salesOrders').where('logistics', '==', '未指定'), function(rows) {
            noLogistics = rows.filter(function(o) { return ['pending', 'confirmed', 'partial'].indexOf(o.status) >= 0 && !o.waveNo; }).length;
            drawErpAlert();
        });
        // 待上架：手機「入庫任務」（即期品待主管核准用紅色）
        listen(db.collection('inboundTasks').where('status', '==', 'pending'), function(rows) {
            otherStat.tasks = rows.filter(function(t) { return isOther(t.locationId); }).length; drawOther();
            rows = rows.filter(function(t) { return isMine(t.locationId); });
            rows.sort(function(a, b) { return String(a.createdAt || '').localeCompare(String(b.createdAt || '')); });
            render('l-tasks', 'c-tasks', rows, function(t) {
                var hold = t.expiryApproval === 'pending', a = ageClass('tasks', t, hold ? 'red' : '');
                return '<div class="card' + a.cls + '" style="--c:#16a34a"><div class="t"><span class="name">' + esc(t.productName) + ' ' + esc(t.spec || '') + '</span><span class="qty">' + esc(t.quantity) + ' 件</span></div>' +
                    '<div class="sub"><span>' + (hold ? '🔴 即期品待主管核准' : esc(t.orderNo || t.palletId || '')) + '　' + a.age + '</span><span class="loc">→ ' + esc(t.locationId || '待指定') + '</span></div></div>';
            }, '目前沒有待上架的貨', 'tasks');
        });
        // 揀貨波次：待揀、揀貨中、待分貨。用跟手機一樣的揀貨清單算出每一項在哪一庫，只顯示這一庫要揀的
        var openWaves = [], checkWaves = [], allPallets = [], consigns = [], palletsReady = false;
        listen(db.collection('waves').where('status', 'in', ['pending', 'picking', 'sorting']), function(rows) { openWaves = rows; drawWaves(); });
        listen(db.collection('consignments').where('status', '==', 'active'), function(rows) { consigns = rows; drawWaves(); });
        listen(db.collection('pallets'), function(rows) {
            allPallets = rows.map(function(p) { return window.normalizeStockRecord ? window.normalizeStockRecord(p) : p; })
                .filter(function(p) { return (parseFloat(p.quantity) || 0) > 0 || (parseFloat(p.totalWeight) || 0) > 0; });
            palletsReady = true;
            drawWaves(); drawExpiry();
        });
        // 練習模式（不看庫存、照訂單揀）跟手機一樣
        if (window.watchPracticeMode) unsubs.push(window.watchPracticeMode(function() { drawWaves(); }));
        if (window.watchProductHomes) unsubs.push(window.watchProductHomes(function() { drawWaves(); }));
        function mineOfWave(w) {
            var list = [];
            try { list = window.buildWavePickingList(w, allPallets, consigns) || []; } catch (e) { console.warn('揀貨清單算不出來', w.waveNo, e); }
            if (!list.length) return MAIN ? { items: [], all: w.itemCount || (w.summary || []).length || 0, done: (w.completedItems || []).length, keys: null } : null;
            var mine = list.filter(itemMine);
            if (!mine.length) return null;
            var q = 0; mine.forEach(function(i) { if (i.type !== 'return' && !i.shortage) q += parseFloat(i.pickQty) || 0; });
            return { items: mine, all: mine.length, done: mine.filter(function(i) { return i.completed; }).length, qty: Math.round(q * 1000) / 1000, both: mine.length < list.length,
                keys: mine.map(function(i) { return i.key; }), allKeys: list.map(function(i) { return i.key; }) };
        }
        function drawWaves() {
            if (!palletsReady) return;
            var rows = [], op = 0, oq = 0;
            // 揀完了、還沒核對完的：顯示「待核對 2 / 5 張」（對完就消失）
            checkWaves.forEach(function(w) { var m = mineOfWave(w); if (m) rows.push(Object.assign({}, w, { _mine: m, _check: window.waveCheckProgress(w) })); });
            openWaves.forEach(function(w) {
                var m = mineOfWave(w); if (m) rows.push(Object.assign({}, w, { _mine: m }));
                if (w.status === 'sorting') return;
                var list = []; try { list = window.buildWavePickingList(w, allPallets, consigns) || []; } catch (e) {}
                var o = list.filter(function(i) { return !itemMine(i) && !i.completed; });
                if (o.length) { if (w.status === 'picking') op++; else oq++; }
            });
            otherStat.picking = op; otherStat.pending = oq; drawOther();
            // 揀貨中的排最前面，其次待揀貨、待分貨；同狀態先來先做（等最久的在上面）
            waveRets = rows.map(function(w) { return { waveNo: w.waveNo, rets: waveReturns(w) }; }).filter(function(x) { return x.rets.length; });
            drawErpAlert();
            var rank = { picking: 0, pending: 1, sorting: 2, done: 3 };
            rows.sort(function(a, b) { return (rank[a.status] - rank[b.status]) || String(a.createdAt || '').localeCompare(String(b.createdAt || '')) || String(a.waveNo || '').localeCompare(String(b.waveNo || '')); });
            render('l-waves', 'c-waves', rows, function(w) {
                var ck = w._check, done = ck ? ck.done : w._mine.done, all = ck ? ck.all : w._mine.all;
                var pct = all ? Math.min(100, Math.round(done / all * 100)) : 0;
                var st = ck ? '<b style="color:#7dd3fc">揀完・待核對</b>' : w.status === 'picking' ? '揀貨中' : w.status === 'sorting' ? '待分貨' : '待揀貨';
                var a = ageClass('waves', w);
                return '<div class="card' + a.cls + '" style="--c:#ea580c"><div class="t"><span class="name">' + esc(w.waveNo) + '　' + esc(w.logistics || '') + '</span><span class="qty">' + esc(w._mine.qty != null ? w._mine.qty : (w.totalQty || 0)) + ' 件</span></div>' +
                    '<div class="sub"><span>' + st + '　' + (w.orderCount || (w.orders || []).length) + ' 單　' + a.age + '</span><span>' + done + '/' + all + (ck ? ' 張' : ' 項') + '</span></div>' +
                    (w._mine.both ? '<div class="sub" style="color:#7dd3fc">🔀 ' + OTHER_NAME + '也有貨要揀，這裡只算本庫的</div>' : '') +
                    waveAsk(w) +
                    (waveReturns(w).length ? '<div class="sub" style="color:#f87171;font-weight:700">↩️ 要放回：' + esc(waveReturns(w).join('、')) + '</div>' : '') +
                    '<div class="bar"><div style="width:' + pct + '%"></div></div></div>';
            }, '目前沒有要揀的波次', 'waves');
        }
        // 調度工單（手機「調度工單」）
        listen(db.collection('dispatchOrders').where('status', 'in', ['pending', 'in_progress']), function(rows) {
            // 移板的儲位有這一庫的才顯示（看不出哪一庫的放 I、J 庫）
            rows = rows.filter(function(o) {
                var locs = [];
                (o.operations || []).forEach(function(op) { [op.from, op.to].forEach(function(l) { if (whOf(l)) locs.push(l); }); });
                return locs.length ? locs.some(isMine) : MAIN;
            });
            $('cols').classList.toggle('with-dispatch', rows.length > 0);
            rows.sort(function(a, b) { return String(a.createdAt || '').localeCompare(String(b.createdAt || '')); });
            render('l-dispatch', 'c-dispatch', rows, function(o) {
                var done = (o.completedOps || []).length, all = (o.operations || []).length, a = ageClass('dispatch', o);
                return '<div class="card' + a.cls + '" style="--c:#7c3aed"><div class="t"><span class="name">' + esc(o.productName || '') + ' ' + esc(o.spec || '') + '</span><span class="qty">' + done + '/' + all + '</span></div>' +
                    '<div class="sub"><span>' + esc(o.orderNo || '') + '　' + a.age + '</span><span>' + (done ? '進行中' : '待執行') + '</span></div>' +
                    '<div class="bar"><div style="width:' + (all ? Math.round(done / all * 100) : 0) + '%"></div></div></div>';
            }, '目前沒有調度工單', 'dispatch');
        });
        // 今天完成：今天的異動記錄；練習模式完成的波次不扣庫存、沒有異動記錄，從波次本身算
        var today = new Date().toLocalYMD();
        var logStat = { waves: {}, inN: 0, outQty: 0, moveN: 0 }, practiceDone = [];
        var drawStats = function() {
            var waves = Object.assign({}, logStat.waves), outQty = logStat.outQty;
            practiceDone.forEach(function(w) { if (!waves[w.waveNo]) { waves[w.waveNo] = true; outQty += parseFloat(w.shippedQty) || 0; } });
            $('s-in').textContent = logStat.inN; $('s-out').textContent = outQty; $('s-move').textContent = logStat.moveN;
            $('s-wave').textContent = Object.keys(waves).length;
        };
        listen(db.collection('inventoryLogs').where('timestamp', '>=', window.localDayStartISO(today)), function(rows) {
            var waves = {}, inN = 0, outQty = 0, moveN = 0;
            rows.forEach(function(l) {
                if (!isMine(l.locationId)) return;
                if (l.type === 'inbound') inN++;
                else if (l.type === 'move') moveN++;
                else if (l.type === 'outbound') {
                    outQty += Math.abs(parseFloat(l.quantityChange) || 0);
                    var m = /波次揀貨 (\S+)/.exec(l.note || '');
                    if (m) waves[m[1]] = true;
                }
            });
            logStat = { waves: waves, inN: inN, outQty: outQty, moveN: moveN };
            drawStats();
        });
        listen(db.collection('waves').where('completedAt', '>=', window.localDayStartISO(today)), function(rows) {
            practiceDone = MAIN ? rows.filter(function(w) { return w.status === 'done' && w.practice; }) : [];
            checkWaves = rows.filter(function(w) { if (w.status !== 'done') return false; var p = window.waveCheckProgress(w); return p.all && p.done < p.all; });
            if (typeof drawWaves === 'function') drawWaves();
            drawStats();
        });
        // 7 天內到期（含已過期）的板數：這一庫的
        drawExpiry = function() {
            var limit = new Date(); limit.setDate(limit.getDate() + 7);
            var lim = limit.toLocalYMD();
            $('s-exp').textContent = allPallets.filter(function(p) { return p.expiryDate && p.expiryDate <= lim && (parseFloat(p.quantity) || 0) > 0 && isMine(p.locationId); }).length;
        };
    }
    var drawExpiry = function() {};
    // 另一個倉庫忙不忙：最上面一行摘要（主要畫面只放自己倉庫的工作）
    var otherStat = { picking: 0, pending: 0, tasks: 0 };
    function drawOther() {
        var n = function(v) { return '<b>' + v + '</b>'; };
        $('other-wh').innerHTML = '🏭 ' + OTHER_NAME + '：揀貨中 ' + n(otherStat.picking) + ' 波・待揀 ' + n(otherStat.pending) + ' 波・待上架 ' + n(otherStat.tasks) + ' 板';
    }

    // ---------- 時鐘、夜間調暗、過午夜重新整理（今天的統計重新開始算）----------
    var startDay = new Date().toLocalYMD();
    function tick() {
        var d = new Date();
        $('clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        $('date').textContent = d.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        checkNight();
        if (d.toLocalYMD() !== startDay) location.reload();
    }
    tick(); setInterval(tick, 15000);

    // 螢幕不要自動休眠（支援的瀏覽器）
    async function keepAwake() {
        try {
            if (!navigator.wakeLock) return;
            var lock = await navigator.wakeLock.request('screen');
            document.addEventListener('visibilitychange', function() { if (document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(function() {}); });
        } catch (e) {}
    }
    </script>
</body>
